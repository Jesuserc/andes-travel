<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso Admin - Andes Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card p-4 shadow-sm w-100" style="max-width: 400px;">
    <div class="text-center mb-3">
      <i class="bi bi-shield-lock text-primary display-5"></i>
      <h3 class="text-dark fw-bold mt-2 mb-0">Acceso Admin</h3>
      <p class="text-muted small">Ingresa tus credenciales para continuar</p>
    </div>
    
    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label text-muted small fw-medium">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="usuario" class="form-control" placeholder="admin" required>
        </div>
      </div>
      
      <div class="mb-3">
        <label class="form-label text-muted small fw-medium">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••" required>
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
      </button>
      
      <a th:href="@{/}" class="btn btn-link w-100 text-center mt-2 text-decoration-none small text-muted">
        <i class="bi bi-arrow-left me-1"></i> Volver al sitio público
      </a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
