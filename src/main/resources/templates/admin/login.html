<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Acceso Admin - Andes Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 380px;">
    <h3 class="text-center mb-4 text-dark fw-bold">Acceso Admin</h3>
    
    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label text-muted small">Usuario</label>
        <input type="text" name="usuario" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="1234" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>
      <a th:href="@{/}" class="btn btn-link w-100 text-center mt-2 text-decoration-none small">Volver al sitio público</a>
    </form>
  </div>

</body>
</html>
