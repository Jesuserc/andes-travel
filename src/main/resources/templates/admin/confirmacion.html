<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva Confirmada - Andes Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { 
      background-color: #0f1815; 
      color: #f2f4f3; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .card-dark { 
      background-color: #172420; 
      border: 1px solid rgba(255,255,255,0.12); 
      border-radius: 16px; 
    }
    .btn-custom-orange { 
      background-color: #c95d3b; 
      color: #fff; 
      border: none; 
      font-weight: 600; 
      border-radius: 8px; 
      transition: all 0.3s ease; 
    }
    .btn-custom-orange:hover { 
      background-color: #b04e2e; 
      color: #fff; 
      transform: translateY(-2px);
    }
    .text-cream { color: #e0d0c1; }

    /* Animación del Avión */
    .airplane-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .airplane-icon {
      font-size: 3.5rem;
      color: #c95d3b;
      animation: fly 3s infinite ease-in-out;
    }
    .pulse-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(201, 93, 59, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes fly {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <div th:replace="~{layout/base :: navbar}"></div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 text-center">
        
        <div class="card card-dark p-4 p-md-5 shadow-lg">
          
          <!-- Animación del Avión -->
          <div class="airplane-container mb-4">
            <div class="pulse-ring"></div>
            <i class="bi bi-airplane-fill airplane-icon"></i>
          </div>

          <h1 class="h2 fw-bold text-white mb-3" style="font-family: Georgia, serif;">¡Solicitud Recibida con Éxito!</h1>
          
          <p class="text-cream fs-5 mb-3">
            Gracias por elegir <strong class="text-warning">Andes Travel</strong> para tu próxima aventura.
          </p>
          
          <div class="p-3 bg-dark bg-opacity-50 rounded border border-secondary border-opacity-25 mb-4 text-start">
            <p class="small text-secondary mb-0 text-center">
              <i class="bi bi-headset text-warning me-2 fs-6"></i>
              Hemos registrado tus datos correctamente. Nuestro equipo de asesores revisará los detalles y <strong>nos estaremos comunicando contigo a la brevedad</strong> vía WhatsApp o correo electrónico.
            </p>
          </div>

          <div>
            <a th:href="@{/}" class="btn btn-custom-orange px-4 py-2 text-uppercase fw-bold">
              <i class="bi bi-house-door-fill me-2"></i> Volver al Inicio
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div th:replace="~{layout/base :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
