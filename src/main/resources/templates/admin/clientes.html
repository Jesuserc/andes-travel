<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('clientes')}"></div>

  <div class="container mb-5">
    <h2 class="mb-3">Clientes</h2>
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <h5 class="mb-3">Registrar Cliente</h5>
      <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post" class="row g-3">
        <div class="col-md-4"><label class="form-label">Nombre</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Correo</label><input type="email" th:field="*{correo}" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Teléfono</label><input type="text" th:field="*{telefono}" class="form-control"></div>
        <div class="col-12"><button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar Cliente</button></div>
      </form>
    </div>

    <form th:action="@{/admin/clientes}" method="get" class="input-group mb-3">
      <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Consultar por nombre, correo o teléfono...">
      <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Buscar</button>
      <a th:href="@{/admin/clientes}" class="btn btn-outline-secondary">Limpiar</a>
    </form>

    <div class="bg-white p-3 rounded shadow-sm table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th></th></tr></thead>
        <tbody>
          <tr th:each="c : ${clientes}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.nombre}">Juan</td>
            <td th:text="${c.correo}">juan@gmail.com</td>
            <td th:text="${c.telefono}">999</td>
            <td class="text-end">
              <form th:action="@{/admin/clientes/eliminar/{id}(id=${c.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar este cliente?');">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="text-center text-muted">Sin resultados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
