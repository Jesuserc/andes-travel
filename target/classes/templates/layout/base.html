<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

  <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}">
        <i class="bi bi-compass"></i> Andes<span class="text-warning">Travel</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/destinos}">Destinos</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/paquetes}">Paquetes</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-warning btn-sm fw-bold px-3" th:href="@{/contacto}">Cotizar viaje</a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">
              <i class="bi bi-person-lock"></i> Admin
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <footer th:fragment="footer" class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="small text-white-50 mb-0">&copy; 2026 Andes Travel · Proyecto Académico UTP</p>
    </div>
  </footer>

</body>
</html>
