<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gráficos de paquetes - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('gpaquetes')}"></div>

  <div class="container my-3 my-md-5">
    <h2 class="mb-1">Gráficos de Paquetes</h2>
    <p class="text-muted small">Datos tomados en vivo de los paquetes registrados.</p>
    
    <!-- Pestañas de navegación adaptadas a móvil -->
    <ul class="nav nav-pills gap-2 mb-4">
      <li class="nav-item flex-fill flex-sm-grow-0">
        <a class="nav-link active text-center" th:href="@{/admin/graficos/paquetes}">Paquetes</a>
      </li>
      <li class="nav-item flex-fill flex-sm-grow-0">
        <a class="nav-link text-center" th:href="@{/admin/graficos/reservas}">Reservas</a>
      </li>
    </ul>

    <!-- Gráficos en tarjetas ajustadas -->
    <div class="row g-3 g-md-4">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm p-3 h-100">
          <h6 class="fw-bold mb-3">Precio por paquete (barras)</h6>
          <div class="position-relative w-100" style="min-height: 250px;">
            <canvas id="barPrecios"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm p-3 h-100">
          <h6 class="fw-bold mb-3">Paquetes por aerolínea (circular)</h6>
          <div class="position-relative w-100 d-flex justify-content-center align-items-center" style="min-height: 250px;">
            <canvas id="pieAero"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script th:inline="javascript">
    const colores = ['#c95d3b','#0d6efd','#198754','#ffc107','#6f42c1','#20c997','#fd7e14','#dc3545'];
    
    // Configuración responsiva para Chart.js
    new Chart(document.getElementById('barPrecios'), {
      type: 'bar',
      data: { 
        labels: /*[[${preciosLabels}]]*/ [],
        datasets: [{ label: 'Precio (S/)', data: /*[[${preciosValues}]]*/ [], backgroundColor: colores }] 
      },
      options: { 
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }, 
        scales: { y: { beginAtZero: true } } 
      }
    });

    new Chart(document.getElementById('pieAero'), {
      type: 'pie',
      data: { 
        labels: /*[[${aeroLabels}]]*/ [],
        datasets: [{ data: /*[[${aeroValues}]]*/ [], backgroundColor: colores }] 
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
