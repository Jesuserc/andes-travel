<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gráficos de reservas - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('greservas')}"></div>

  <div class="container mb-5">
    <h2 class="mb-1">Gráficos de Reservas</h2>
    <p class="text-muted">Datos tomados en vivo de las reservas registradas.</p>
    <ul class="nav nav-pills mb-4">
      <li class="nav-item"><a class="nav-link" th:href="@{/admin/graficos/paquetes}">Paquetes</a></li>
      <li class="nav-item"><a class="nav-link active" th:href="@{/admin/graficos/reservas}">Reservas</a></li>
    </ul>
    <div class="row g-4">
      <div class="col-lg-7"><div class="card shadow-sm p-3"><h6>Reservas por fecha (líneas)</h6><canvas id="lineFecha"></canvas></div></div>
      <div class="col-lg-5"><div class="card shadow-sm p-3"><h6>Reservas por paquete (circular)</h6><canvas id="doughPaq"></canvas></div></div>
      <div class="col-12"><div class="card shadow-sm p-3"><h6>Viajeros por paquete (barras)</h6><canvas id="barViaj" height="90"></canvas></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script th:inline="javascript">
    const colores = ['#c95d3b','#0d6efd','#198754','#ffc107','#6f42c1','#20c997','#fd7e14','#dc3545'];
    new Chart(document.getElementById('lineFecha'), {
      type: 'line',
      data: { labels: /*[[${fechaLabels}]]*/ [],
              datasets: [{ label: 'Reservas', data: /*[[${fechaValues}]]*/ [], borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,.15)', fill: true, tension: .3 }] },
      options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
    new Chart(document.getElementById('doughPaq'), {
      type: 'doughnut',
      data: { labels: /*[[${paqLabels}]]*/ [],
              datasets: [{ data: /*[[${paqValues}]]*/ [], backgroundColor: colores }] }
    });
    new Chart(document.getElementById('barViaj'), {
      type: 'bar',
      data: { labels: /*[[${viajLabels}]]*/ [],
              datasets: [{ label: 'Viajeros', data: /*[[${viajValues}]]*/ [], backgroundColor: '#198754' }] },
      options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
