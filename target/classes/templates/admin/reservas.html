<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('reservas')}"></div>

  <div class="container my-3 my-md-5">
    <h2 class="mb-3">Gestión de Reservas</h2>
    
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FORMULARIO: Registrar Reserva -->
    <div class="card p-3 p-md-4 shadow-sm mb-4">
      <h5 class="mb-3">Registrar Reserva</h5>
      <form th:action="@{/admin/reservas/guardar}" th:object="${reserva}" method="post" class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label">Cliente</label>
          <input type="text" th:field="*{nombreCliente}" class="form-control" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Correo</label>
          <input type="email" th:field="*{correoCliente}" class="form-control" required>
        </div>
        <div class="col-6 col-sm-6 col-md-3">
          <label class="form-label">Viajeros</label>
          <input type="number" min="1" th:field="*{numeroViajeros}" class="form-control" required>
        </div>
        <div class="col-6 col-sm-6 col-md-3">
          <label class="form-label">Fecha</label>
          <input type="date" th:field="*{fecha}" class="form-control">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Paquete</label>
          <select th:field="*{nombrePaquete}" class="form-select" required>
            <option value="">Seleccione...</option>
            <option th:each="p : ${paquetes}" th:value="${p.nombre}" th:text="${p.nombre}"></option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Mensaje</label>
          <input type="text" th:field="*{mensaje}" class="form-control">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success w-100 w-sm-auto">
            <i class="bi bi-save"></i> Guardar Reserva
          </button>
        </div>
      </form>
    </div>

    <!-- CONSULTA Y BÚSQUEDA -->
    <form th:action="@{/admin/reservas}" method="get" class="row g-2 mb-3">
      <div class="col-12 col-md">
        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Consultar por cliente, correo, paquete o mensaje...">
      </div>
      <div class="col-6 col-md-auto">
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Buscar</button>
      </div>
      <div class="col-6 col-md-auto">
        <a th:href="@{/admin/reservas}" class="btn btn-outline-secondary w-100">Limpiar</a>
      </div>
    </form>

    <!-- LISTADO -->
    <div class="table-responsive bg-white p-3 rounded shadow-sm">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Correo</th>
            <th>Paquete</th>
            <th>Viajeros</th>
            <th>Mensaje</th>
            <th class="text-end">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${reservas}">
            <td th:text="${r.id}">1</td>
            <td th:text="${r.fecha}">2026-09-27</td>
            <td th:text="${r.nombreCliente}">Juan</td>
            <td th:text="${r.correoCliente}">juan@gmail.com</td>
            <td th:text="${r.nombrePaquete}">Cusco</td>
            <td th:text="${r.numeroViajeros}">2</td>
            <td th:text="${r.mensaje}">Mensaje</td>
            <td class="text-end text-nowrap">
              <form th:action="@{/admin/reservas/eliminar/{id}(id=${r.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar esta reserva?');">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="8" class="text-center text-muted">Sin resultados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
