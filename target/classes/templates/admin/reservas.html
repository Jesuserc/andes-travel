<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Reservas - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('reservas')}"></div>

  <div class="container my-3 my-md-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Gestión y Control de Reservas</h2>
    </div>
    
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i><span th:text="${ok}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- CONSULTA, BÚSQUEDA Y FILTRO DESPLEGABLE (Página 2 para la Rúbrica) -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <form th:action="@{/admin/reservas}" method="get" id="filterReservasForm" class="row g-2 align-items-center">
          
          <!-- Búsqueda por texto libre -->
          <div class="col-12 col-md-5">
            <label class="form-label fw-bold small text-muted mb-1">Buscar por palabras clave:</label>
            <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Consultar por cliente, correo o paquete...">
          </div>

          <!-- Filtro Desplegable por Paquete Turístico -->
          <div class="col-12 col-md-5">
            <label class="form-label fw-bold small text-muted mb-1">
              <i class="bi bi-funnel-fill text-primary me-1"></i> Filtrar por Paquete:
            </label>
            <select name="estado" class="form-select" onchange="document.getElementById('filterReservasForm').submit()">
              <option value="" th:selected="${estadoSeleccionado == null || estadoSeleccionado == ''}">-- Mostrar Todos los Paquetes --</option>
              <option th:each="paq : ${paquetes}" 
                      th:value="${paq.nombre}" 
                      th:text="${paq.nombre}" 
                      th:selected="${estadoSeleccionado == paq.nombre}">Paquete</option>
            </select>
          </div>

          <!-- Botones de Acción -->
          <div class="col-12 col-md-2 d-flex gap-2 pt-md-4">
            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Buscar</button>
            <a th:href="@{/admin/reservas}" class="btn btn-outline-secondary" title="Limpiar Filtros"><i class="bi bi-arrow-counterclockwise"></i></a>
          </div>

        </form>
      </div>
    </div>

    <!-- 1. CONTENEDOR: SOLICITUDES PENDIENTES DE ATENCIÓN -->
    <div class="card shadow-sm border-0 mb-5">
      <div class="card-header bg-warning bg-opacity-25 py-3 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0 fw-bold text-dark">
          <i class="bi bi-clock-history me-2 text-warning"></i> Solicitudes Pendientes de Atención
        </h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Fecha Viaje</th>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Paquete</th>
                <th class="text-center">Personas</th>
                <th class="text-end">Monto (S/)</th>
                <th>Estado</th>
                <th class="text-end me-2">Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${reservas}" th:if="${r.estado == null or r.estado == 'PENDIENTE'}">
                <td th:text="${r.id}" class="fw-bold">1</td>
                <td th:text="${r.fechaViaje
