<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paquetes - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div th:replace="~{layout/admin :: nav('paquetes')}"></div>

  <div class="container my-3 my-md-5">
    <h2 class="mb-3">Gestión de Paquetes Turísticos</h2>
    
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FORMULARIO: registrar / editar -->
    <div class="card p-3 p-md-4 shadow-sm mb-4">
      <h5 class="mb-3" th:text="${editando} ? 'Editar Paquete' : 'Registrar Nuevo Paquete'">Registrar Nuevo Paquete</h5>
      <form th:action="@{/admin/paquetes/guardar}" th:object="${paquete}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        
        <div class="col-12 col-md-6">
          <label class="form-label">Nombre del Paquete</label>
          <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label">Duración</label>
          <input type="text" th:field="*{duracion}" class="form-control" placeholder="5 días / 4 noches" required>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <label class="form-label">Precio (S/)</label>
          <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control" required>
        </div>
        
        <div class="col-12 col-md-6">
          <label class="form-label">Incluye</label>
          <input type="text" th:field="*{incluye}" class="form-control" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">URL Imagen</label>
          <input type="text" th:field="*{imagenUrl}" class="form-control" required>
        </div>
        
        <div class="col-12 col-sm-4">
          <label class="form-label">Hotel</label>
          <input type="text" th:field="*{hotel}" class="form-control">
        </div>
        <div class="col-12 col-sm-4">
          <label class="form-label">Movilidad</label>
          <input type="text" th:field="*{movilidad}" class="form-control">
        </div>
        <div class="col-12 col-sm-4">
          <label class="form-label">Aerolínea</label>
          <input type="text" th:field="*{aerolinea}" class="form-control">
        </div>
        
        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea th:field="*{descripcion}" class="form-control" rows="2" required></textarea>
        </div>
        
        <div class="col-12 d-flex flex-wrap gap-3 gap-md-4 align-items-center">
          <div class="form-check">
            <input type="checkbox" th:field="*{todoIncluido}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('todoIncluido')}">Todo incluido</label>
          </div>
          <div class="form-check">
            <input type="checkbox" th:field="*{desayuno}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('desayuno')}">Desayuno</label>
          </div>
        </div>
        
        <div class="col-12 d-flex flex-column flex-sm-row gap-2">
          <button type="submit" class="btn btn-success w-100 w-sm-auto">
            <i class="bi bi-save"></i> <span th:text="${editando} ? 'Actualizar Paquete' : 'Guardar Paquete'">Guardar Paquete</span>
          </button>
          <a th:if="${editando}" th:href="@{/admin/dashboard}" class="btn btn-outline-secondary w-100 w-sm-auto">Cancelar</a>
        </div>
      </form>
    </div>

    <!-- CONSULTA -->
    <form th:action="@{/admin/dashboard}" method="get" class="row g-2 mb-3">
      <div class="col-12 col-md">
        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Consultar por nombre, hotel, aerolínea, incluye...">
      </div>
      <div class="col-6 col-md-auto">
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Buscar</button>
      </div>
      <div class="col-6 col-md-auto">
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary w-100">Limpiar</a>
      </div>
    </form>

    <!-- LISTADO -->
    <div class="table-responsive bg-white p-3 rounded shadow-sm">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Duración</th>
            <th>Precio</th>
            <th>Hotel</th>
            <th>Aerolínea</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${paquetes}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.nombre}">Cusco</td>
            <td th:text="${p.duracion}">5 días</td>
            <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 1,890.00</td>
            <td th:text="${p.hotel}">Hotel</td>
            <td th:text="${p.aerolinea}">LATAM</td>
            <td class="text-end text-nowrap">
              <a th:href="@{/admin/paquetes/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a>
              <form th:action="@{/admin/paquetes/eliminar/{id}(id=${p.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Desea eliminar este paquete?');">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(paquetes)}">
            <td colspan="7" class="text-center text-muted">Sin resultados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
